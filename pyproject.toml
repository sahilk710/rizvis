[project]
name = "jarvis-ai-assistant"
version = "0.1.0"
description = "J.A.R.V.I.S. — Just A Rather Very Intelligent System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,openai,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
    "psutil",
    "starlette",
    "uvicorn",
]

[project.scripts]
jarvis = "server:main"
jarvis_voice = "agent:dev"
jarvis_cloud = "agent:cloud"
jarvis_dashboard = "dashboard_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
